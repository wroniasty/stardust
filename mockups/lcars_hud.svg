<svg viewBox="0 0 660 812" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Arial Narrow', Arial, Helvetica, sans-serif"><title>HUD gry stardust w stylu LCARS ze Star Trek TNG, stan normalny i alarm</title><desc>Dwie makiety ekranu 640x360. Rama LCARS zajmuje krawędzie: kolanko w lewym górnym narożniku łączy poziomy pasek tytułu z pionową kolumną numerowanych bloków, po prawej lista wierszy z etykietą w bloku i wartością na czarnym tle, u dołu pasek czterech segmentów z nazwami trybów lotu. Środek ekranu pozostaje czarny i tam żyją przyrządy rysowane kreską: taśma wysokości, horyzont i wektor prędkości. W stanie alarmu cała rama zmienia rodzinę kolorów na czerwoną, bo w palecie, gdzie wszystko jest pomarańczowe, ostrzeżenie nie może być odcieniem.</desc>
