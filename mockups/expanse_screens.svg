<svg viewBox="0 0 660 812" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="300"><title>HUD lotu i plot nawigacyjny gry stardust w stylistyce serialu The Expanse</title><desc>Dwie makiety ekranu 640x360. HUD lotu: brak paneli i ramek, informacje wiszą na cienkich liniach włosowych. Nagłówkiem są ciąg w g i pozostały budżet delta-v, obok odliczanie do końca palenia, w prawym górnym rogu okrągły plot kontaktów z wektorami, na dole cienkie łuki wskaźników i stos odczytów nawigacyjnych bez obwódek. Plot nawigacyjny: koncentryczne pierścienie, orbita bieżąca ciągła, planowany transfer kreskowany z dwoma węzłami palenia opisanymi kosztem delta-v, po prawej cienki stos danych, u dołu zakładki podkreślone linią zamiast wypełnionych bloków.</desc>
