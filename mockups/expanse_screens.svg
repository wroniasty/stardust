<clipPath id="view"><rect x="0" y="0" width="640" height="360"/></clipPath>
<clipPath id="plot"><rect x="0" y="0" width="640" height="360"/></clipPath>
</defs>
<rect x="0" y="0" width="660" height="812" fill="#0A0A0C"/>

