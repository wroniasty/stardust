<svg viewBox="0 0 660 1180" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace" role="img"><title>Makiety trzech ekranów pełnoekranowych: edytor statku, mapa systemu, mapa galaktyki</title><desc>Edytor statku pokazuje kadłub na siatce montażowej z nawiasami przy gniazdach, podniesiony moduł jako widmo przy kursorze i prawą kolumnę z raportem konfiguracji: masa, środek masy i sześć pasków autorytetu na komendę, z różnicą względem poprzedniej konfiguracji. Mapa systemu to schemat: gwiazda w środku, orbity jako kreskowane okręgi, ciała jako dyski, statek jako nawias z przewidywaną trajektorią i kropkowany okrąg granicy wpływu. Mapa galaktyki to punkty gwiazd kolorowane klasą widmową, nawias na systemie bieżącym, kreskowany okrąg zasięgu skoku i trasa złożona z trzech przeskoków.</desc>
<defs>
<pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="1" height="1" fill="#3A4757" opacity="0.55"/></pattern>
</defs>
<rect x="0" y="0" width="660" height="1180" fill="#05070B"/>

