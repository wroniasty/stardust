<svg viewBox="0 0 660 812" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Arial Narrow', Arial, Helvetica, sans-serif"><title>Edytor statku i mapa systemu w stylu LCARS ze Star Trek TNG</title><desc>Dwie makiety ekranu 640x360. Edytor statku: szeroka kolumna LCARS po lewej, w której każde gniazdo montażowe jest osobnym przyciskiem, pośrodku kadłub jako niebieski szkielet na czarnym tle z pozłacanymi nawiasami gniazd, po prawej raport konfiguracji z sześcioma paskami autorytetu pociętymi na segmenty. Mapa systemu: schemat orbit kreską na czarnym tle wewnątrz ramy LCARS, po prawej lista danych wybranego ciała, u dołu pasek segmentów z trybami mapy.</desc>
