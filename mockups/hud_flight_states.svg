<svg viewBox="0 0 660 1568" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, monospace" role="img"><title>Cztery stany HUD gry stardust: próżnia, orbita, lądowanie, walka</title><desc>Cztery makiety ekranu 640x360. W próżni prawy dolny panel przyrządów jest pusty, a głównym przyrządem jest taśma kursu i skaner. Na orbicie prawy górny panel awansuje do rysowanego diagramu orbity. Przy lądowaniu pełny panel przyrządów, taśma wysokości i wskaźniki nałożone na teren. W walce lewy górny panel awansuje do sylwetki kadłuba i dużego paska energii, cel dostaje narożny nawias, a pozostałe panele przygasają. We wszystkich czterech stanach panele zajmują te same cztery narożniki.</desc>
